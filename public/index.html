<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bookstore Search</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <h1>&#128218; Bookstore Search</h1>

    <div class="tabs" id="category-tabs">
      <button type="button" class="tab active" data-category="fiction">Fiction</button>
      <button type="button" class="tab" data-category="non-fiction">Non-Fiction</button>
    </div>

    <label for="search-input">Search by title</label>
    <input type="text" id="search-input" placeholder="Search titles..." />

    <label for="author-input">Search by author</label>
    <input type="text" id="author-input" placeholder="Search authors..." />

    <div class="filters" id="filters"></div>
    <button type="button" id="clear-all">Clear All Filters</button>

    <div id="error" class="error" hidden></div>
    <div id="loading" hidden>Loading...</div>
    <p id="summary"></p>
    <ul id="results"></ul>

    <div id="pagination">
      <button type="button" id="prev-page">Previous</button>
      <button type="button" id="next-page">Next</button>
    </div>
  </div>

  <script type="module" src="/app/web/browser-app.js"></script>
</body>
</html>
